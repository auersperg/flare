name: Publish npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version in packages/flare/package.json
        required: true
        type: string
      tag:
        description: npm distribution tag
        type: choice
        default: next
        options: [next, latest]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'auersperg/flare' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      CI: "true"
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Check exact package and requested release
        run: |
          node --input-type=module -e 'import {readFileSync} from "node:fs";const p=JSON.parse(readFileSync("packages/flare/package.json","utf8"));if(p.name!=="@auersperg/flare"||p.private||p.license!=="MIT"||p.version!==process.env.RELEASE_VERSION||!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(p.version)||!["next","latest"].includes(process.env.RELEASE_TAG))throw Error("Invalid release request");'
      - name: Download the accepted archive for this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --commit "$GITHUB_SHA" --status success --json databaseId,event --jq 'map(select(.event == "push" or .event == "workflow_dispatch")) | .[0].databaseId // empty')
          if [ -z "$run" ]; then
            echo "No successful CI for this commit. Wait for CI or rerun CI before publishing." >&2
            exit 1
          fi
          gh run download "$run" --repo "$GITHUB_REPOSITORY" --name npm-package --dir artifacts
      - name: Install pinned OIDC-capable npm
        run: npm install --global npm@12.1.0
      - name: Publish through npm trusted publishing
        run: |
          node scripts/verify-package-artifact.mjs
          npm publish "artifacts/packages/flare/auersperg-flare-${RELEASE_VERSION}.tgz" --access public --tag "$RELEASE_TAG" --provenance
