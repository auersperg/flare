name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test and package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun audit --production --audit-level=high
      - run: bun run verify
      - run: bun run test:mcp-auth:local
      - run: bun run test:kernel
      - run: bun scripts/platform-native-acceptance.mjs
      - run: bun run test:platform:reproducible
        if: github.repository == 'auersperg/flare' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - name: Ensure verification leaves tracked source unchanged
        run: git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.repository == 'auersperg/flare' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: npm-package
          path: |
            artifacts/package-acceptance.json
            artifacts/packages/flare/*.tgz
          if-no-files-found: error
          compression-level: 0
