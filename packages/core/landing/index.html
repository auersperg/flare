<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#201f1d" />
    <meta
      name="description"
      content="Flare — a self-hosted, Cloudflare-native reactive backend."
    />
    <title>Flare</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          16px/1.6 system-ui,
          sans-serif;
        background: #201f1d;
        color: #faf9f6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        max-width: 640px;
        width: 100%;
      }
      .eyebrow {
        color: #acaaa5;
        font-size: 13px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      h1 {
        font-size: clamp(64px, 12vw, 108px);
        line-height: 1.1;
        margin: 16px 0 24px;
        letter-spacing: -0.065em;
        font-weight: 600;
      }
      p {
        max-width: 480px;
        color: #b7b4ad;
        font-size: 19px;
      }
      a {
        display: inline-flex;
        margin-top: 24px;
        background: #f0eee9;
        color: #201f1d;
        border: 1px solid #f0eee9;
        border-radius: 8px;
        padding: 11px 20px;
        text-decoration: none;
        font-weight: 600;
      }
      a:hover {
        background: #d9d6d0;
      }
      a:focus-visible {
        outline: 2px solid #86b8f0;
        outline-offset: 4px;
      }
      footer {
        margin-top: 72px;
        color: #8c8983;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Cloudflare-native · Self-hosted</div>
      <h1>Flare</h1>
      <p>Reactive data. Server functions. Your infrastructure.</p>
      <p>
        A simple backend for your applications. Currently in private preview.
      </p>
      <a href="https://dash.flare.auer.wien/">Open dashboard →</a>
      <footer>Built on Cloudflare. Hosted by Auer.</footer>
    </main>
  </body>
</html>
